<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" media="screen" type="text/css">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print" type="text/css">

    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->

{% seo %}

    {% include head-custom.html %}
  </head>

  <body>
   <header>
     <table style=" border: inset 0pt">
        <tr style="text-align: left; border: inset 0pt">
          <td style="text-align: left; border: inset 0pt">
            <div class="inner">
              <a href="{{ '/' | absolute_url }}">
                <h1>{{ site.title}} </h1>
              </a>
                <!--Descomentar para que aaprezca el texto Clasificación resultados y proximos partidos--> 
                <!--h2>{{ site.description}}</h2--> 
            </div>
          </td>
          <td style="text-align: left; border: inset 0pt">
             <div style="text-align: left;" data-proofer-ignore>
                <img src="images/Escudo.png" width="180" height="110" alt="Escudo" onerror="this.style.display='none'"/>
             </div>
          </td>
        </tr>
      </table>
    </header>

    <div id="content-wrapper">
      <div class="inner clearfix">
        <section id="main-content">
          {{ content }}
        </section>

        <aside id="sidebar">
          {% if site.show_downloads %}
            <a href="{{ site.github.zip_url }}" class="button">
              <small>Download</small>
              .zip file
            </a>
            <a href="{{ site.github.tar_url }}" class="button">
              <small>Download</small>
              .tar.gz file
            </a>
          {% endif %}
        </aside>
      </div>
    </div>

  </body>
</html>
